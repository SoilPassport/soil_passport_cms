name: Scheduled jobs

# Runs the background jobs every 5 minutes: event reminders, review/approval emails, newsletter sending,
# HubSpot retries and clean-up. You can also run it by hand: Actions tab -> "Scheduled jobs" -> Run workflow.
# Needs repository secrets: SUPABASE_PROJECT_REF and CRON_SECRET (the same value as the Supabase secret CRON_SECRET).
# Note: GitHub may delay scheduled runs by several minutes, and pauses them after 60 days without repository activity.
# For exact timing use pg_cron instead (see docs/SETUP.md). UNTESTED against a live project.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call the scheduled function
        env:
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$REF" ] || [ -z "$CRON_SECRET" ]; then echo "::error::Add SUPABASE_PROJECT_REF and CRON_SECRET as repository secrets."; exit 1; fi
          curl --fail-with-body -sS -X POST --max-time 120 -H "x-cron-secret: $CRON_SECRET" "https://$REF.supabase.co/functions/v1/scheduled"
