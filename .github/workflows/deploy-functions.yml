name: Deploy Supabase functions

# Run manually: Actions tab -> "Deploy Supabase functions" -> Run workflow.
# Needs repository secrets:
#   SUPABASE_ACCESS_TOKEN  (Supabase dashboard -> Account -> Access Tokens -> Generate new token)
#   SUPABASE_PROJECT_REF   (the part of your project URL before .supabase.co, e.g. luototmqgoqrhdhtyicy)
# UNTESTED against a live project: check the run log and the Edge Functions page in Supabase after running.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check secrets
        env:
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$REF" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF as repository secrets first."
            exit 1
          fi
      - name: Deploy invite-user and media-r2
        env:
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase functions deploy invite-user --project-ref "$REF"
          supabase functions deploy media-r2 --project-ref "$REF"
